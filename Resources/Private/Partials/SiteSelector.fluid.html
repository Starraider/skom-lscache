<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:if condition="{dashboard.hasSiteOptions()}">
    <f:then>
        <form action="{dashboard.dashboardUrl}" method="get" class="vstack gap-3" data-site-selector-form>
            <div>
                <label for="lscache-site-selector" class="form-label">
                    <f:translate key="LLL:EXT:skom_lscache/Resources/Private/Language/locallang.xlf:dashboard.siteSelector.label" />
                </label>
                <select id="lscache-site-selector" name="site" class="form-select">
                    <f:for each="{dashboard.siteOptions}" as="site">
                        <option value="{site.identifier}"{f:if(condition: site.selected, then: ' selected="selected"')}>{site.label}</option>
                    </f:for>
                </select>
            </div>

            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                <p class="text-body-secondary mb-0 small">
                    <f:translate key="LLL:EXT:skom_lscache/Resources/Private/Language/locallang.xlf:dashboard.siteSelector.help" />
                </p>
                <button type="submit" class="btn btn-primary">
                    <f:translate key="LLL:EXT:skom_lscache/Resources/Private/Language/locallang.xlf:dashboard.siteSelector.submit" />
                </button>
            </div>
        </form>
    </f:then>
    <f:else>
        <div class="alert alert-info mb-0">
            <f:translate key="LLL:EXT:skom_lscache/Resources/Private/Language/locallang.xlf:dashboard.siteSelector.none" />
        </div>
    </f:else>
</f:if>

</html>
