services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Skom\Lscache\:
    resource: '../Classes/*'

  Skom\Lscache\Purge\TagNamespaceResolverInterface: '@Skom\Lscache\Purge\SiteTagNamespaceResolver'

  # Must stay shared inside one request so all collaborators see the same queue instance.
  # Request isolation is provided by TYPO3/PHP request lifecycle (no static state).
  Skom\Lscache\Purge\PurgeQueue:
    shared: true

  skom.lscache.purge_queue:
    alias: Skom\Lscache\Purge\PurgeQueue
    public: true

  Skom\Lscache\Purge\PurgeServiceInterface: '@Skom\Lscache\Purge\PurgeService'

  skom.lscache.purge_service:
    alias: Skom\Lscache\Purge\PurgeService
    public: true

  Skom\Lscache\Http\PageContentInventoryProvider: '@Skom\Lscache\Http\DbalPageContentInventoryProvider'

  Skom\Lscache\Http\CacheabilityClassifierInterface: '@Skom\Lscache\Http\CacheabilityClassifier'

  Skom\Lscache\Backend\Probe\CacheProbeClientInterface: '@Skom\Lscache\Backend\Probe\CacheProbeClient'

  skom.lscache.cacheability_classifier:
    alias: Skom\Lscache\Http\CacheabilityClassifier
    public: true

  skom.lscache.tag_schema:
    alias: Skom\Lscache\Http\TagSchema
    public: true

  Skom\Lscache\Purge\EventListener\DataHandlerTagResolver:
    public: true
  Skom\Lscache\Purge\EventListener\DataHandlerRecordSavedListener:
    public: true
  Skom\Lscache\Purge\EventListener\DataHandlerRecordDeletedListener:
    public: true
  Skom\Lscache\Purge\EventListener\DataHandlerRecordMovedListener:
    public: true
