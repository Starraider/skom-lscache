lscache:
  enabled: true
  defaultTtl: 3600
  tagNamespace: ''
  autopurge:
    dataHandler: true
    tables: []
  mirror:
    cacheFlushEvent: false
  bypass:
    loggedInFE: true
    setCookie: true
    paths: []
    pluginSignatures: []
    ctypes: []
  vary:
    cookieAllowlist: []
  loopback:
    secret: '%env(LSCACHE_LOOPBACK_SECRET)%'
    rateLimit: 120
    allowedRemoteAddrs: ['167.235.201.149']
  probe:
    allowedHosts: []
  audit:
    retentionDays: 7
